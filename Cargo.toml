[workspace]
resolver = "3"
members = ["crates/*"]

# Settings every member inherits, so an edition or a version is one edit rather
# than five that can drift apart.
#
# No `license` key. Which license this repository carries is an open decision
# for the maintainer, #16, and a manifest field is not the place to settle it by
# accident.
[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/iderex/ausgleich"
# The oldest toolchain this workspace is expected to build on. It is a field
# here and nowhere else: the `msrv build` check reads it out of the metadata
# rather than carrying its own copy, so raising the floor is this one edit and
# is visible in a diff.
#
# 1.85.0 is where the 2024 edition starts, so it is the floor the edition
# already forces rather than a number anybody picked. Lower is not available
# without giving up the edition; higher would be a choice and would need a
# reason written next to it.
rust-version = "1.85.0"
# Nothing here goes to a registry. It is not a decision about #16 entry 1, it is
# what follows from that entry being open: cargo refuses to publish a crate with
# no license, and a contributor asserting the Developer Certificate of Origin
# asserts a right to submit under a project license that does not exist yet.
#
# It also does work in the gate. `deny` judges the licenses of everything in the
# graph, and these five members have none, so the policy in deny.toml treats a
# member that cannot be published as private and judges the dependencies
# instead. Deciding entry 1 is what removes this line, and the check goes back
# to judging our own crates the moment it is gone.
publish = false

# The members, named once, so a member depending on another writes
# `workspace = true` and no path is repeated. Which of these edges are allowed is
# not decided here: it is asserted by the test in
# crates/ausgleich-cli/tests/dependency_edges.rs, and an edge added to a member
# manifest without a line in that test reds the suite.
[workspace.dependencies]
ausgleich-data = { path = "crates/ausgleich-data" }
ausgleich-equations = { path = "crates/ausgleich-equations" }
ausgleich-solve = { path = "crates/ausgleich-solve" }
ausgleich-report = { path = "crates/ausgleich-report" }

# Warnings are errors, declared here rather than as an argument the gate passes.
#
# In the manifest the rule reaches every route that compiles this workspace: the
# gate, a contributor's `cargo build`, `cargo test`, `cargo clippy` and the floor
# build. As `RUSTFLAGS=-D warnings` in one workflow it would reach that workflow
# only, and a warning would be an error in the gate and a scrollable line
# everywhere else, which is how a tree learns to ignore them.
#
# It is also narrower than the environment variable in the direction that
# matters. `RUSTFLAGS` reaches dependency code as well, so the first crate this
# workspace pulls in that carries a deprecation would fail a build for a warning
# nobody here can fix. The lints table reaches the members and stops.
#
# `priority = -1` puts the group below any named lint, so a specific `allow`
# with a reason beside it still wins. Denying the group with default priority
# would make every such exception impossible to express.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }

[profile.release]
# One codegen unit. Splitting a crate across units changes which calls the
# optimiser can see across, so the count is an input to the code that comes out.
# Pinning it removes that input; whether the numbers this program prints move
# with it is not measured here and is #3's question. Written down rather than
# left at the default so that raising it is an edit to a line that says why it
# is one.
codegen-units = 1
