[package]
name = "ausgleich-equations"
description = "The registry of observational equations, each printing the form it implements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# An equation is written against the record types it reads, so it sees the data
# model. It does not see the loader's filesystem side, which is why that side
# stays behind a function the equation crate never calls.
ausgleich-data = { workspace = true }

# Warnings are errors here too. The levels are the workspace ones, in
# [workspace.lints] at the root, so this member does not carry its own copy and
# cannot drift from the others. A member that omits these two lines opts out of
# the whole table in silence, which is what
# crates/ausgleich-cli/tests/workspace_lints.rs refuses.
[lints]
workspace = true
