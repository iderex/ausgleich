[package]
name = "ausgleich-data"
description = "The record types for an input set, and the loader that reads them off disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Inherited, and the reason is in the root manifest.
publish.workspace = true

# No workspace dependency, in either direction with the solver. The loader knows
# nothing about the solve, so a fixture for the solver can never need a
# directory on disk to exist.
[dependencies]
# One dependency, and nothing else on this branch. time 0.1.45 carries
# RUSTSEC-2020-0071, an open vulnerability, and its license and those of the
# three crates it pulls in are all on the allowlist, so the advisory leg is what
# moves.
time = "=0.1.45"

# Warnings are errors here too. The levels are the workspace ones, in
# [workspace.lints] at the root, so this member does not carry its own copy and
# cannot drift from the others. A member that omits these two lines opts out of
# the whole table in silence, which is what
# crates/ausgleich-cli/tests/workspace_lints.rs refuses.
[lints]
workspace = true
