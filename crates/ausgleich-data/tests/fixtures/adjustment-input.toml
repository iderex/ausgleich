# A provenance block, as one sits inside an input datum file.
#
# Every value here is invented. The publication does not exist, the identifier
# resolves to nothing, and no field was copied out of a real paper. That is
# deliberate: a fixture carrying a real citation is a claim about a real
# publication that nobody checked against the publication, and this fixture
# exists to exercise a shape rather than to record a measurement.
#
# It is the domain of this repository: a value that would enter a constants
# adjustment.

version = 1

[publication]
authors = ["Beispiel, A.", "Muster, B.", "Probe, C."]
title = "A fixture standing in for a measurement of a fundamental constant"
venue = "Journal of Fixtures"
year = 2019
doi = "10.0000/fixture-adjustment-input"

[read_from]
locator = "Table IV"
page = 17

[measurement]
reported = 2018-11-05
method = "kibble-balance"
origin = "measured"

[uncertainty]
kind = "combined"
coverage_factor = 1.0

[digitisation]
read_by = "Reader, A."
read_on = 2026-02-11
confirmed_by = "Checker, B."
confirmed_on = 2026-02-13
