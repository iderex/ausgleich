[package]
name = "ausgleich-solve"
description = "The least-squares solve: structs in, structs out, no filesystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# No workspace dependency at all, and that is the point of this crate's place in
# the workspace. It is the crate that carries fixture tests and a mutation run,
# and neither is possible for code that reads a directory on the way in. It also
# keeps the file seam honest: the solver cannot see the loader, so the problem
# file is the only route between them.
[dependencies]

# Warnings are errors here too. The levels are the workspace ones, in
# [workspace.lints] at the root, so this member does not carry its own copy and
# cannot drift from the others. A member that omits these two lines opts out of
# the whole table in silence, which is what
# crates/ausgleich-cli/tests/workspace_lints.rs refuses.
[lints]
workspace = true
