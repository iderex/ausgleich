[package]
name = "ausgleich-report"
description = "The report an operator reads, rendered from a result and the input set that produced it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# The report names the input set it came from, so it sees the record types.
ausgleich-data = { workspace = true }
# It renders the result the solve returns, so it sees those types too.
ausgleich-solve = { workspace = true }

# Warnings are errors here too. The levels are the workspace ones, in
# [workspace.lints] at the root, so this member does not carry its own copy and
# cannot drift from the others. A member that omits these two lines opts out of
# the whole table in silence, which is what
# crates/ausgleich-cli/tests/workspace_lints.rs refuses.
[lints]
workspace = true
