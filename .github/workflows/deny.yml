# Advisories, licenses, duplicate versions and sources, judged against a policy
# that lives in a file.
#
# The job id is `deny` and the job sets no `name:`, so the check-run name is
# `deny`.
#
# What is checked and how strictly is in deny.toml at the root, next to the
# reason for each line. Nothing about the policy is written here, and that is
# the point of the issue this job comes from: a threshold on a command line is
# one somebody widens in the same commit as the change that needed it widened,
# and the diff reads as a workflow edit rather than as a decision.
#
# The license leg is not hygiene here. Which license this repository carries is
# entry 1 of #16 and is open, so the allowlist is the intersection that is safe
# under every option still on the table, and deny.toml says so in the place a
# reader will be standing when they want to widen it.
#
# The tool is built here rather than fetched through a third-party action, for
# the reason coverage.yml gives: this repository takes no action it did not pin
# and no installer it did not name, and the cost is the minutes it takes to
# compile.
#
# Runs on every branch as well as on pull requests, so a fixture branch proving
# this check bites can red it without opening a pull request.
name: Deny

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned, so a release of the checker cannot change what this check means
      # without an edit here. What is not pinned is the advisory database, and
      # that is deliberate: an advisory published this morning is exactly what
      # this leg exists to catch, so the one input that must be fresh is the one
      # that is fetched every run.
      CARGO_DENY_VERSION: "0.18.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain the pin resolved to
        run: cargo --version

      - name: Install the checker
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo deny --version

      # All four legs in one invocation, so a failure in one is not hidden by a
      # job that stopped at another. --show-stats makes the run say what it
      # examined rather than only whether it was happy.
      - name: Check the graph against the policy
        run: cargo deny --all-features check --show-stats
